<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Predict the greenhouse grouping.</title><desc id="desc">Diagram of three greenhouse beds, each with four plots, emphasizing three groups of four rather than a flat twelve.</desc><rect width="640" height="480" fill="#fffdf6"/><text x="34" y="55" class="title">Predict the greenhouse grouping.</text><g class="diagram"><text x="60" y="145">Bed 1</text><text x="60" y="188">● ● ● ●</text><text x="60" y="233">Bed 2</text><text x="60" y="276">● ● ● ●</text><text x="60" y="321">Bed 3</text><text x="60" y="364">● ● ● ●</text><path d="M330 130h170v250H330z"/><text x="360" y="220">4 plots</text><text x="350" y="275">× 3 beds</text><text x="350" y="335">12 actions</text></g><style>.title{font:700 22px sans-serif;fill:#263b2b}.diagram{font:20px sans-serif;fill:#25342a;stroke:#477d37;stroke-width:3}.diagram text{stroke:none}.diagram path{fill:none}.diagram rect{fill:#fffdf6}</style></svg>