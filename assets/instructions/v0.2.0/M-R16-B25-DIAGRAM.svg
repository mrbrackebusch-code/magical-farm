<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Stormbloom final-synthesis diagram.</title><desc id="desc">Diagram of three spark bulbs with three spark chambers each, showing nine baseline target decisions grouped by bulb and a conductivity decision for every focused target.</desc><rect width="640" height="480" fill="#fffdf6"/><text x="34" y="55" class="title">Stormbloom final-synthesis diagram.</text><g class="diagram"><text x="70" y="150">BULB 1:  ✦ ✦ ✦</text><text x="70" y="210">BULB 2:  ✦ ✦ ✦</text><text x="70" y="270">BULB 3:  ✦ ✦ ✦</text><text x="70" y="340">3 groups × 3 sparks = 9</text><path d="M305 215h170v90H305z"/><text x="322" y="252">focus target</text><text x="322" y="280">then test conductivity</text></g><style>.title{font:700 22px sans-serif;fill:#263b2b}.diagram{font:20px sans-serif;fill:#25342a;stroke:#477d37;stroke-width:3}.diagram text{stroke:none}.diagram path{fill:none}.diagram rect{fill:#fffdf6}</style></svg>