<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Moon Grove structure diagram.</title><desc id="desc">Diagram showing one Moon Grove bed as an outer-loop work unit: enter bed, repeat protect/tend while pests remain, then harvest after the while loop.</desc><rect width="640" height="480" fill="#fffdf6"/><text x="34" y="55" class="title">Moon Grove structure diagram.</text><g class="diagram"><rect x="42" y="105" width="490" height="300" rx="14"/><text x="70" y="145">NEXT BED</text><rect x="90" y="175" width="400" height="170" rx="12"/><text x="110" y="215">WHILE pests remain</text><text x="135" y="255">IF armored → protect</text><text x="135" y="295">ELSE → tend</text><text x="110" y="375">HARVEST after while ends</text></g><style>.title{font:700 22px sans-serif;fill:#263b2b}.diagram{font:20px sans-serif;fill:#25342a;stroke:#477d37;stroke-width:3}.diagram text{stroke:none}.diagram path{fill:none}.diagram rect{fill:#fffdf6}</style></svg>