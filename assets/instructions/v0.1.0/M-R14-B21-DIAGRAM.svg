<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Packing Barn loop-boundary diagram.</title><desc id="desc">Diagram showing one crate containing six fruit decisions, with the seal action placed after the six-fruit inner loop but before the next crate.</desc><rect width="640" height="480" fill="#fffdf6"/><text x="34" y="55" class="title">Packing Barn loop-boundary diagram.</text><g class="diagram"><rect x="45" y="115" width="480" height="270" rx="12"/><text x="70" y="155">CRATE 1</text><text x="95" y="220">fruit 1 → 2 → 3 → 4 → 5 → 6</text><path d="M70 265h430"/><text x="110" y="320">seal crate</text><text x="300" y="320">then next crate</text></g><style>.title{font:700 22px sans-serif;fill:#263b2b}.diagram{font:20px sans-serif;fill:#25342a;stroke:#477d37;stroke-width:3}.diagram text{stroke:none}.diagram path{fill:none}.diagram rect{fill:#fffdf6}</style></svg>